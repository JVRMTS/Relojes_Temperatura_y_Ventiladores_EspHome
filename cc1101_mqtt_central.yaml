            static const uint32_t codes[] = {
              2780831953UL, 1623204049UL, 113254609UL, 230695121UL
            };
            return codes[id(luz_level_salon)];

  - platform: template
    name: "Ventilador Salón - Luz Bajar"
    on_press:
