substitutions:
  device_name: cc1101-mqtt-central
  friendly_name: CC1101 MQTT Central
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password
  api_key_reloj: !secret api_key_reloj
  mqtt_username: !secret mqtt_username
  mqtt_password: !secret mqtt_password
  broker: !secret broker

# Codigos RF editables por el usuario.
packages:
  codigos_rf: !include assets/codigos_ventiladores.yaml

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.1" # Tras la primera instalación, consulta los registros en ESPHome Device Builder: muestran la revisión del ESP32 que debes usar aquí. Para una placa desconocida, omite esta opción al compilar por primera vez.
      flash_chip: generic
      sram1_as_iram: true

logger:

api:
  encryption:
    key: ${api_key_reloj}

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: ${wifi_ssid}
  password: ${wifi_password}
  fast_connect: true
  output_power: 8.5dB
  power_save_mode: none
  manual_ip:
    static_ip: 192.168.1.18
    gateway: 192.168.1.1
    subnet: 255.255.255.0

spi:
  id: spi_bus
  type: single
  clk_pin: GPIO18
  miso_pin: GPIO19
  mosi_pin: GPIO23

cc1101:
  id: rf_radio
  cs_pin: GPIO5
  frequency: 433.92MHz
  output_power: 10
  modulation_type: ASK/OOK
  symbol_rate: 5000
  filter_bandwidth: 812kHz
  packet_mode: false
  crc_enable: false
  whitening: false

remote_transmitter:
  - id: rf_transmitter
    pin: GPIO2
    non_blocking: true
    carrier_duty_percent: 100%
    on_transmit:
      then:
        - logger.log: "CC1101: iniciando transmisión RF"
        - cc1101.begin_tx
    on_complete:
      then:
        - logger.log: "RMT: transmisión RF completada; CC1101 en reposo"
        - cc1101.set_idle

globals:
  - id: rc_code
    type: std::string
    restore_value: no
    initial_value: '""'

mqtt:
  broker: ${broker}
  port: 1883
  username: ${mqtt_username}
  password: ${mqtt_password}
  on_json_message:
    - topic: "casa/dormitorio/ventilador/set"
      then:
        - lambda: |-
            if (!x["accion"].is<const char *>()) {
              ESP_LOGW("rf_fan", "Mensaje ignorado: falta accion de texto");
              return;
            }
            id(transmit_fan_rf_command).execute(1, std::string(x["accion"].as<const char *>()));
    - topic: "casa/salon/ventilador/set"
      then:
        - lambda: |-
            if (!x["accion"].is<const char *>()) {
              ESP_LOGW("rf_fan", "Mensaje ignorado: falta accion de texto");
              return;
            }
            id(transmit_fan_rf_command).execute(2, std::string(x["accion"].as<const char *>()));
script:
  - id: transmit_rf_command
    mode: queued
    parameters:
      code: uint32_t
    then:
      - lambda: |-
          std::string bits;
          bits.reserve(32);
          for (int bit = 31; bit >= 0; --bit) {
            bits += ((code >> bit) & 1U) ? '1' : '0';
          }
          id(rc_code) = bits;
      - remote_transmitter.transmit_rc_switch_raw:
          transmitter_id: rf_transmitter
          code: !lambda return id(rc_code);
          protocol:
            pulse_length: 390
            sync: [23, 1]
            zero: [1, 2]
            one: [2, 1]
            inverted: true
          repeat:
            times: 2
            wait_time: 10ms

  - id: transmit_fan_rf_command
    mode: queued
    parameters:
      room: int
      accion: string
    then:
      - lambda: |-
          // Los valores RF se editan en assets/codigos_ventiladores.yaml.
          struct ComandoRF { const char *accion; uint32_t dormitorio; uint32_t salon; };
          static const ComandoRF comandos[] = {
            {"luz", ${rf_dormitorio_luz}UL, ${rf_salon_luz}UL},
            {"ventilador", ${rf_dormitorio_ventilador}UL, ${rf_salon_ventilador}UL},
            {"luz_amarilla", ${rf_dormitorio_luz_amarilla}UL, ${rf_salon_luz_amarilla}UL},
            {"luz_blanca", ${rf_dormitorio_luz_blanca}UL, ${rf_salon_luz_blanca}UL},
            {"luz_azul", ${rf_dormitorio_luz_azul}UL, ${rf_salon_luz_azul}UL},
            {"bajar_luz", ${rf_dormitorio_bajar_luz}UL, ${rf_salon_bajar_luz}UL},
            {"subir_luz", ${rf_dormitorio_subir_luz}UL, ${rf_salon_subir_luz}UL},
            {"velocidad_1", ${rf_dormitorio_velocidad_1}UL, ${rf_salon_velocidad_1}UL},
            {"velocidad_2", ${rf_dormitorio_velocidad_2}UL, ${rf_salon_velocidad_2}UL},
            {"velocidad_3", ${rf_dormitorio_velocidad_3}UL, ${rf_salon_velocidad_3}UL},
            {"velocidad_4", ${rf_dormitorio_velocidad_4}UL, ${rf_salon_velocidad_4}UL},
            {"velocidad_5", ${rf_dormitorio_velocidad_5}UL, ${rf_salon_velocidad_5}UL},
            {"invertir_giro", ${rf_dormitorio_invertir_giro}UL, ${rf_salon_invertir_giro}UL},
            {"temporizador_2h", ${rf_dormitorio_temporizador_2h}UL, ${rf_salon_temporizador_2h}UL},
            {"temporizador_4h", ${rf_dormitorio_temporizador_4h}UL, ${rf_salon_temporizador_4h}UL},
            {"temporizador_8h", ${rf_dormitorio_temporizador_8h}UL, ${rf_salon_temporizador_8h}UL},
          };
          if (room != 1 && room != 2) {
            ESP_LOGW("rf_fan", "Habitacion no valida: %d", room);
            return;
          }
          for (const auto &comando : comandos) {
            if (accion == comando.accion) {
              id(transmit_rf_command).execute(room == 1 ? comando.dormitorio : comando.salon);
              return;
            }
          }
          ESP_LOGW("rf_fan", "Accion desconocida: %s", accion.c_str());

fan:
  - platform: template
    name: "Ventilador Dormitorio"
    speed_count: 5
    on_turn_on:
      - script.execute:
          id: transmit_fan_rf_command
          room: 1
          accion: "ventilador"
    on_turn_off:
      - script.execute:
          id: transmit_fan_rf_command
          room: 1
          accion: "ventilador"
    on_speed_set:
      - script.execute:
          id: transmit_fan_rf_command
          room: 1
          accion: !lambda |-
            if (x < 1 || x > 5) return std::string("invalida");
            return std::string("velocidad_") + std::to_string(x);

  - platform: template
    name: "Ventilador Salón"
    speed_count: 5
    on_turn_on:
      - script.execute:
          id: transmit_fan_rf_command
          room: 2
          accion: "ventilador"
    on_turn_off:
      - script.execute:
          id: transmit_fan_rf_command
          room: 2
          accion: "ventilador"
    on_speed_set:
      - script.execute:
          id: transmit_fan_rf_command
          room: 2
          accion: !lambda |-
            if (x < 1 || x > 5) return std::string("invalida");
            return std::string("velocidad_") + std::to_string(x);

select:
  - platform: template
    name: "Ventilador Dormitorio - Color Luz"
    id: color_luz_dormitorio
    options:
      - "Amarilla"
      - "Blanca"
      - "Azul"
    optimistic: true
    on_value:
      - script.execute:
          id: transmit_fan_rf_command
          room: 1
          accion: !lambda |-
            if (x == "Blanca") return std::string("luz_blanca");
            if (x == "Azul") return std::string("luz_azul");
            return std::string("luz_amarilla");

  - platform: template
    name: "Ventilador Salón - Color Luz"
    id: color_luz_salon
    options:
      - "Amarilla"
      - "Blanca"
      - "Azul"
    optimistic: true
    on_value:
      - script.execute:
          id: transmit_fan_rf_command
          room: 2
          accion: !lambda |-
            if (x == "Blanca") return std::string("luz_blanca");
            if (x == "Azul") return std::string("luz_azul");
            return std::string("luz_amarilla");

  - platform: template
    name: "Ventilador Dormitorio - Timer"
    id: timer_dormitorio
    options:
      - "2h"
      - "4h"
      - "8h"
    optimistic: true
    on_value:
      - script.execute:
          id: transmit_fan_rf_command
          room: 1
          accion: !lambda |-
            if (x == "4h") return std::string("temporizador_4h");
            if (x == "8h") return std::string("temporizador_8h");
            return std::string("temporizador_2h");

  - platform: template
    name: "Ventilador Salón - Timer"
    id: timer_salon
    options:
      - "2h"
      - "4h"
      - "8h"
    optimistic: true
    on_value:
      - script.execute:
          id: transmit_fan_rf_command
          room: 2
          accion: !lambda |-
            if (x == "4h") return std::string("temporizador_4h");
            if (x == "8h") return std::string("temporizador_8h");
            return std::string("temporizador_2h");

button:
  # --- DORMITORIO ---
  - platform: template
    name: "Ventilador Dormitorio - Luz General"
    on_press:
      - script.execute:
          id: transmit_fan_rf_command
          room: 1
          accion: "luz"
  - platform: template
    name: "Ventilador Dormitorio - Luz Subir"
    on_press:
      - script.execute:
          id: transmit_fan_rf_command
          room: 1
          accion: "subir_luz"
  - platform: template
    name: "Ventilador Dormitorio - Luz Bajar"
    on_press:
      - script.execute:
          id: transmit_fan_rf_command
          room: 1
          accion: "bajar_luz"
  - platform: template
    name: "Ventilador Dormitorio - Invertir giro"
    on_press:
      - script.execute:
          id: transmit_fan_rf_command
          room: 1
          accion: "invertir_giro"
  # --- SALÓN ---
  - platform: template
    name: "Ventilador Salón - Luz General"
    on_press:
      - script.execute:
          id: transmit_fan_rf_command
          room: 2
          accion: "luz"
  - platform: template
    name: "Ventilador Salón - Luz Subir"
    on_press:
      - script.execute:
          id: transmit_fan_rf_command
          room: 2
          accion: "subir_luz"
  - platform: template
    name: "Ventilador Salón - Luz Bajar"
    on_press:
      - script.execute:
          id: transmit_fan_rf_command
          room: 2
          accion: "bajar_luz"
  - platform: template
    name: "Ventilador Salón - Invertir giro"
    on_press:
      - script.execute:
          id: transmit_fan_rf_command
          room: 2
          accion: "invertir_giro"