substitutions:
  device_name: reloj-aseo
  friendly_name: Reloj Aseo
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password
  api_key_reloj: !secret api_key_reloj
  mqtt_username: !secret mqtt_username
  mqtt_password: !secret mqtt_password

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2026.9.1

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      sram1_as_iram: true

logger:

api:
  encryption:
    key: ${api_key_reloj}

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: ${wifi_ssid}
  password: ${wifi_password}
  output_power: 8.5dB
  fast_connect: true
  manual_ip:
    static_ip: 192.168.1.22
    gateway: 192.168.1.1
    subnet: 255.255.255.0
    dns1: 192.168.1.201
    dns2: 192.168.1.204

time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/Madrid
    on_time_sync:
      then:
        - logger.log: "Hora sincronizada"
    on_time:
      - seconds: 0
        minutes: /5
        then:
          - logger.log: "Hora actualizada"   
sensor:
  - platform: dht
    pin: GPIO27
    model: DHT22
    temperature:
      name: "temp_aseo"
      id: temp_aseo
    humidity:
      name: "hum_aseo"
      id: hum_aseo

  - platform: adc
    id: ldr_raw
    pin: GPIO32
    name: "LDR ADC raw"
    attenuation: 12db
    raw: true
    update_interval: 1000ms
    on_value:
      then:
        - light.turn_on:
            id: lcd_backlight_light
            transition_length: 0s
            brightness: !lambda |-
              int valor_pwm = static_cast<int>(x) / 16;
              if (valor_pwm < 100) valor_pwm = 100;
              if (valor_pwm > 255) valor_pwm = 255;
              return valor_pwm / 255.0f;
  - platform: template
    id: sen_ter
    name: "Sensación Térmica"
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    device_class: temperature
    update_interval: 2s
    lambda: |-
      float temp_c = id(temp_aseo).state;
      float hum = id(hum_aseo).state;
      if (isnan(temp_c) || isnan(hum)) return NAN;
      float t = temp_c * 1.8 + 32;
      float hi = 0.5 * (t + 61.0 + ((t - 68.0) * 1.2) + (hum * 0.094));
      if (hi >= 80.0) {
        hi = -42.379 + 2.04901523 * t + 10.14333127 * hum
           - 0.22475541 * t * hum - 0.00683783 * t * t
           - 0.05481717 * hum * hum + 0.00122874 * t * t * hum
           + 0.00085282 * t * hum * hum - 0.00000199 * t * t * hum * hum;
      }
      return (hi - 32) / 1.8;   
  - platform: wifi_signal
    id: wifi_rssi
    name: "Aseo senal wifi"
    update_interval: 60s

interval:
  - interval: 2s
    then:
      - if:
          condition:
            lambda: |-
              return !isnan(id(temp_aseo).state) && !isnan(id(hum_aseo).state);
          then:
            - mqtt.publish:
                topic: casa/aseo/variables
                payload: !lambda |-
                  char json[128];
                  const float temp = id(temp_aseo).state;
                  const float humidity = id(hum_aseo).state;
                  const float heat_index = id(sen_ter).state;
                  const float rssi = id(wifi_rssi).state;
                  snprintf(json, sizeof(json),
                    "{\"temperatura\":%.2f,\"humedad\":%.1f,\"sen_termica\":%.2f,\"WiFi_Signal\":%.0f}",
                    temp, humidity, heat_index, isnan(rssi) ? -100.0f : rssi);
                  return std::string(json);
                qos: 2
                retain: true
# Mapeo de Hardware I2C
i2c:
  sda: 21
  scl: 22

# Lógica de visualización (Corregido para validar LCD2004)
display:
  - platform: lcd_pcf8574
    address: 0x27
    dimensions: 20x4
    lambda: |-
      auto now = id(sntp_time).now();
      const char *dias[] = {"Dom", "Lun", "Mar", "Mie", "Jue", "Vie", "Sab"};
      const char *meses[] = {"Ene", "Feb", "Mar", "Abr", "May", "Jun", "Jul", "Ago", "Sep", "Oct", "Nov", "Dic"};
      it.printf(7, 0, "%02d:%02d", now.hour, now.minute);
      it.printf(2, 1, "%s %d %s %d", dias[now.day_of_week - 1], now.day_of_month, meses[now.month - 1], now.year);
      if (!isnan(id(temp_aseo).state) && !isnan(id(hum_aseo).state)) {
        it.printf(0, 2, "Tem:%.1fC", id(temp_aseo).state);
        it.printf(11, 2, "Hum:%.1f%%", id(hum_aseo).state);
      } else {
        it.printf(0, 2, "Tem:--C");
        it.printf(11, 2, "Hum:--");
      }
      if (!isnan(id(sen_ter).state)) {
        it.printf(2, 3, "Sen.Ter.:%.1fC", id(sen_ter).state);
      } else {
        it.printf(2, 3, "Sen.Ter.:--");
      }      
# Configuración de MQTT
mqtt:
  broker: 192.168.1.203
  port: 1883
  username: !secret mqtt_username
  password: !secret mqtt_password
  topic_prefix: "casa/aseo/variables"

# Control de la luz de fondo
output:
  - platform: ledc
    pin: GPIO18
    id: lcd_backlight
    frequency: 5kHz

light:
  - platform: monochromatic
    output: lcd_backlight
    id: lcd_backlight_light
    name: "Retroiluminación LCD"
    icon: "mdi:lightbulb"