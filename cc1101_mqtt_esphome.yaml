substitutions:
  device_name: cc1101-mqtt-central
  friendly_name: CC1101 MQTT Central
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password
  api_key_reloj: !secret api_key_reloj
  mqtt_username: !secret mqtt_username
  mqtt_password: !secret mqtt_password

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2026.9.1

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.0"     
      sram1_as_iram: true

logger:
  level: INFO

api:
  encryption:
    key: ${api_key_reloj}

ota:
  - platform: esphome
    encryption:
    
wifi:
  ssid: ${wifi_ssid}
  password: ${wifi_password}
  fast_connect: true
  output_power: 8.5dB
  power_save_mode: none
  manual_ip:
    static_ip: 192.168.1.18
    gateway: 192.168.1.1
    subnet: 255.255.255.0

spi:
  id: spi_bus
  type: single
  clk_pin: GPIO18
  miso_pin: GPIO19
  mosi_pin: GPIO23

cc1101:
  id: rf_radio
  cs_pin: GPIO5
  gdo0_pin:
    number: GPIO2
    allow_other_uses: true
  frequency: 433.92MHz
  output_power: 10
  filter_bandwidth: 812kHz

remote_transmitter:
  - id: rf_transmitter
    pin:
      number: GPIO2
      allow_other_uses: true
    non_blocking: true
    carrier_duty_percent: 100%
    on_transmit:
      then:
        - logger.log: "CC1101: iniciando transmisión RF"
        - cc1101.begin_tx
    on_complete:
      then:
        - logger.log: "RMT: transmisión RF completada; volviendo a recepción"
        - cc1101.begin_rx

globals:
  - id: rc_code
    type: std::string
    initial_value: '""'
  - id: rc_code_valid
    type: bool
    initial_value: "false"

mqtt:
  broker: 192.168.1.203
  port: 1883
  username: ${mqtt_username}
  password: ${mqtt_password}
  on_connect:
    then:
      - logger.log: "Conectado al broker MQTT; listo para recibir comandos RF"
  on_disconnect:
    then:
      - logger.log: "Se perdió la conexión con el broker MQTT"
  on_message:
    - topic: "casa/+/ventilador"
      then:
        - logger.log:
            format: "Mensaje MQTT recibido en tópico de ventilador: %s"
            args:
              - x.c_str()
  on_json_message:
    - topic: "casa/+/ventilador"
      then:
        - lambda: |-
            id(rc_code_valid) = false;
            if (!x.containsKey("opcion") || !x["opcion"].is<uint32_t>()) {
              ESP_LOGW("rf_fan", "Mensaje ignorado: falta 'opcion' uint32");
              return;
            }

            const uint32_t value = x["opcion"].as<uint32_t>();
            if (value == 0) {
              ESP_LOGW("rf_fan", "Comando MQTT cero ignorado; no es un código RF válido");
              return;
            }
            ESP_LOGI("rf_fan", "Comando MQTT válido; preparando transmisión RF: %u", value);
            std::string bits;
            bits.reserve(32);
            for (int bit = 31; bit >= 0; --bit) {
              bits += ((value >> bit) & 1U) ? '1' : '0';
            }
            id(rc_code) = bits;
            id(rc_code_valid) = true;
        - if:
            condition:
              lambda: return id(rc_code_valid);
            then:
              - logger.log: "RF: entrando en la acción de transmisión"
              - remote_transmitter.transmit_rc_switch_raw:
                  transmitter_id: rf_transmitter
                  code: !lambda return id(rc_code);
                  protocol:
                    pulse_length: 390
                    sync: [23, 1]
                    zero: [1, 2]
                    one: [2, 1]
                    inverted: true
                  repeat:
                    times: 2
                    wait_time: 10ms
              - logger.log: "RF: acción de transmisión retornó"
switch:
  - platform: restart
    name: esp-cam restart                   
